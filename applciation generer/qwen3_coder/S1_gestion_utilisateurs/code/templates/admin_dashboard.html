{% extends "base.html" %}
{% block content %}
<h2>Administration</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Actif</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>{{ 'Oui' if user.is_active else 'Non' }}</td>
            <td><a href="/admin/edit_user/{{ user.id }}" class="btn btn-sm btn-secondary">Modifier</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
