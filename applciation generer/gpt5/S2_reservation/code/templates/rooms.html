{% extends 'base.html' %}
{% block content %}
<h1>Liste des salles</h1>
<div class="cards">
  {% for r in rooms %}
  <div class="card">
    <h3>{{ r.name }}</h3>
    <p>Capacité: {{ r.capacity }}</p>
    <p>{{ r.description }}</p>
    <a class="btn" href="{{ url_for('room_detail', room_id=r.id) }}">Voir et réserver</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
