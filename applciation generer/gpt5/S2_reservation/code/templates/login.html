{% extends 'base.html' %}
{% block content %}
<h1>Connexion</h1>
<form method="post">
  <label>Email
    <input type="email" name="email" required>
  </label>
  <label>Mot de passe
    <input type="password" name="password" required>
  </label>
  <button class="btn" type="submit">Se connecter</button>
</form>
<p>Pas de compte ? <a href="{{ url_for('register') }}">Inscrivez-vous</a></p>
{% endblock %}
