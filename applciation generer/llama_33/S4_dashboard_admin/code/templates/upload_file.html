<!DOCTYPE html>
<html>
<head>
    <title>Télécharger un Fichier</title>
</head>
<body>
    <h1>Télécharger un Fichier</h1>
    <form method="POST" enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        {{ form.file.label }} {{ form.file() }}
        {{ form.submit() }}
    </form>
</body>
</html>
